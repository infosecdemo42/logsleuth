[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "logsleuth"
version = "0.2.0"
description = "Parse and triage common server logs from the command line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "infosecdemo42" }]
keywords = ["logs", "nginx", "syslog", "security", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
logsleuth = "logsleuth.cli:main"

[project.urls]
Homepage = "https://github.com/infosecdemo42/logsleuth"
Issues = "https://github.com/infosecdemo42/logsleuth/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/logsleuth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
